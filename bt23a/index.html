<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 23a - Game kiểm tra tốc độ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Game kiểm tra tốc độ phản xạ</h1>

    <div class="info">
        <div>Điểm: <b id="score">0</b></div>
        <div>Thời gian: <b id="time">30</b> giây</div>
        <div>Người chơi: <b id="player">?</b></div>
    </div>

    <div class="controls">
        <label for="timeInput">Thời gian chơi (giây):</label>
        <input type="number" id="timeInput" value="30" min="5" max="120">
        <button id="startBtn">Bắt đầu trò chơi</button>
        <button id="colorBtn">Đổi màu nền</button>
        <button id="playerBtn">Người chơi</button>
    </div>

    <div class="wrap">
        <div id="arena">
            <div id="target"></div>
            <div id="message">Chọn thời gian rồi bấm "Bắt đầu trò chơi"</div>
        </div>
    </div>

    <p class="footer">Nguyễn Hoà Ngọc Nhiên - MSSV: 231A010265</p>

    <script src="script.js"></script>
</body>
</html>
